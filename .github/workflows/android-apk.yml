# Builds the Android debug APK and hands it back as a downloadable artifact.
#
# Why this workflow exists: packaging an Android app needs `aapt2` / `zipalign`, and Google only
# ships those as x86-64 Linux ELF binaries — an aarch64 host (e.g. a phone running a Linux
# container) cannot execute them. The GitHub runner is x86-64, so the build belongs here.
#
# Manual runs: Actions -> "Android APK" -> Run workflow. The APK lands under the run's Artifacts.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle variant to assemble"
        required: true
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
  push:
    branches:
      - master
      - android-gles

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble ${{ github.event.inputs.variant || 'assembleDebug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Provides ANDROID_HOME + sdkmanager. `packages` is overridden because the action's default
      # list includes the legacy `tools` package, which current cmdline-tools no longer resolve.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # libs.versions.toml pins compileSdk = 37; android-36 stays installed as a fallback for the
      # toolchain, and build-tools 36.0.0 is what the project's CI already uses.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble APK
        run: ./gradlew :android:${{ github.event.inputs.variant || 'assembleDebug' }} --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          found=$(find app/android/build/outputs/apk -name '*.apk' -type f | sort | head -1)
          if [ -z "$found" ]; then
            echo "::error::No APK produced under app/android/build/outputs/apk"
            find app/android/build -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          ls -la "$found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umamo-android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
